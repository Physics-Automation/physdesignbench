name: Task image release

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task ID (or all configured tasks)
        required: true
        default: anisotropic-swg-beamsplitter-v0
      release_version:
        description: Explicit semantic release version
        required: true
        default: 0.1.0-pilot.1
      source_ref:
        description: Source revision (blank uses the selected workflow branch)
        required: false
      dry_run:
        description: Build and inspect without publishing
        type: boolean
        default: true
  pull_request:
    paths:
      - tasks/**
      - scripts/release/**
      - scripts/evaluator_build_inputs.py
      - vendor/harbor/**
      - runtime/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/publish-images.yml

permissions:
  contents: read

concurrency:
  group: task-images-${{ github.ref }}-${{ inputs.release_version || 'pr' }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TASK_ID: ${{ inputs.task_id || 'anisotropic-swg-beamsplitter-v0' }}
      RELEASE_VERSION: ${{ inputs.release_version || '0.1.0-pilot.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.8.22
      - uses: docker/setup-buildx-action@v3
      - name: Install the preserved Harbor runtime and release tools
        run: uv sync --locked --extra dev
      - name: Check release logic and task structure
        run: |
          uv run python scripts/check_structure.py
          uv run pytest tests/release -q
          uv run python -m scripts.release inventory --task "$TASK_ID" --version "$RELEASE_VERSION" --manifest .release/plan.json
      - name: Build existing Dockerfiles (never pushes)
        run: uv run python -m scripts.release build --task "$TASK_ID" --version "$RELEASE_VERSION" --manifest .release/build.json
      - name: Inspect layers, credentials, isolation and offline imports
        run: uv run python -m scripts.release check --manifest .release/build.json
      - name: Authenticate to Docker Hub for an explicit manual publication only
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish, resolve digests and pull independently
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: uv run python -m scripts.release publish --manifest .release/build.json --execute --output .release/image-manifest.json
      - name: Assemble immutable Harbor task copies
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          uv run python -m scripts.release pin --manifest .release/image-manifest.json --destination ".release/package-$RELEASE_VERSION"
          uv run python -m scripts.release validate --manifest .release/image-manifest.json --package ".release/package-$RELEASE_VERSION" --output .release/validation.json
          tar -czf .release/harbor-task-package.tar.gz -C ".release/package-$RELEASE_VERSION" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-image-release-${{ github.run_id }}
          path: |
            .release/*.json
            .release/harbor-task-package.tar.gz
          include-hidden-files: true
          if-no-files-found: error
