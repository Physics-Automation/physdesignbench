[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "physdesignbench"
version = "0.1.0"
description = "Physics-based engineering tasks and reproducible Harbor releases"
requires-python = ">=3.12"
dependencies = ["harbor>=0.24,<0.25", "PyYAML>=6,<7", "tomlkit>=0.13,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "gdstk==1.0.1", "numpy>=2,<3"]

[tool.uv.sources]
harbor = {path = "vendor/harbor", editable = true}

[tool.setuptools.packages.find]
where = ["runtime/compat"]

[tool.pytest.ini_options]
pythonpath = ["."]
